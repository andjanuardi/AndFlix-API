name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o andflix-api .
      - uses: actions/upload-artifact@v4
        with:
          name: andflix-api-linux
          path: andflix-api
