openapi: "3.0.3"
info:
  title: ANDFLIX-API
  description: |
    Simplified REST API untuk streaming.

    Proxy yang menyederhanakan akses ke layanan streaming menjadi endpoint RESTful yang mudah digunakan.

    ## Endpoints Utama

    - `POST /getHome` — navigasi + konten halaman utama
    - `POST /search` — pencarian film, drama, TV
    - `POST /getDetail` — detail konten + player streaming + subtitle
    - `GET /image` — proxy gambar (cover/poster)
    - `GET /subtitle` — proxy subtitle SRT (difilter: Indonesia & English)
    - `GET /stream` — proxy HLS (m3u8 rewrite + segment .ts)

    ## Session

    Session dikelola otomatis via header:
    - `X-Device-Id` — simpan dari response, kirim kembali di request berikutnya
    - `X-Aeskey-Internal` — simpan dan kirim kembali
    - `X-Token` — JWT untuk request terautentikasi

    ## Catatan

    - Subtitle hanya bahasa Indonesia (in_ID/in) dan English (en/en_US)
    - URL gambar, subtitle, dan stream otomatis di-rewrite ke proxy endpoint
    - `resourceStatus`: 1 → "Sedang Tayang", 2 → "Selesai"
  version: "2.0.0"
servers:
  - url: http://localhost:8080
    description: Development server

components:
  securitySchemes:
    LOKLOKAuth:
      type: apiKey
      in: header
      name: X-Token
      description: JWT token dari autentikasi
  parameters:
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: false
      schema:
        type: string
      description: Device ID dari response proxy sebelumnya
    AeskeyInternalHeader:
      name: X-Aeskey-Internal
      in: header
      required: false
      schema:
        type: string
      description: AES key internal (PC API only)
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: string
          example: "00000"
        msg:
          type: string
          example: "Success"
        data:
          type: object
          nullable: true
    NavigationItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cnName:
          type: string
        redirectContentType:
          type: string
          enum: [HOME, RANK]
        redirectUrl:
          type: string
        pictureUrl:
          type: string
        sequence:
          type: integer
    ContentItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        introduction:
          type: string
        coverHorizontalUrl:
          type: string
          format: uri
        coverVerticalUrl:
          type: string
          format: uri
        score:
          type: number
          format: float
          nullable: true
        releaseTime:
          type: string
        resourceNum:
          type: integer
          nullable: true
        resourceStatus:
          type: integer
          nullable: true
        domainType:
          type: integer
        subType:
          type: string
          enum: [MOVIE, DRAMA, COMIC, TV, VARIETY]
        sort:
          type: string
        areas:
          type: array
          items:
            $ref: "#/components/schemas/NamePair"
        episodeVo:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeSummary"
    NamePair:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    EpisodeSummary:
      type: object
      properties:
        seriesNo:
          type: integer
        paidMode:
          type: integer
        ellipsis:
          type: boolean
    HomeSection:
      type: object
      properties:
        homeSectionId:
          type: integer
        homeSectionType:
          type: string
          enum: [BANNER, SINGLE_ALBUM]
        homeSectionName:
          type: string
        cnName:
          type: string
        bannerProportion:
          type: number
          format: float
        recommendContentVOList:
          type: array
          items:
            $ref: "#/components/schemas/HomeContentItem"
    HomeContentItem:
      type: object
      properties:
        cid:
          type: string
        contentType:
          type: string
          enum: [MOVIE, DRAMA]
        title:
          type: string
        imageUrl:
          type: string
          format: uri
        introduction:
          type: string
        year:
          type: integer
        score:
          type: number
          format: float
          nullable: true
        resourceStatus:
          type: integer
          nullable: true
        resourceNum:
          type: integer
          nullable: true
        jumpAddress:
          type: string
    H5SubtitleItem:
      type: object
      properties:
        language:
          type: string
        languageAbbr:
          type: string
        subtitlingUrl:
          type: string
          example: "/subtitle?url=https://..."
        translateType:
          type: integer
    StreamItem:
      type: object
      properties:
        definition:
          type: string
          enum: [GROOT_HD, GROOT_SD, GROOT_LD, GROOT_FD]
        url:
          type: string
          example: "/stream?url=https://..."
    PlayerInfo:
      type: object
      properties:
        id:
          type: integer
        seriesNo:
          type: integer
        name:
          type: string
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/H5SubtitleItem"
        duration:
          type: integer
          nullable: true
        urls:
          type: array
          items:
            $ref: "#/components/schemas/StreamItem"
    H5DefinitionItem:
      type: object
      properties:
        code:
          type: string
          enum: [GROOT_HD, GROOT_SD, GROOT_LD, GROOT_FD]
        description:
          type: string
        fullDescription:
          type: string
    H5EpisodeItem:
      type: object
      properties:
        id:
          type: integer
        seriesNo:
          type: integer
        name:
          type: string
        definitionList:
          type: array
          items:
            $ref: "#/components/schemas/H5DefinitionItem"
        subtitlingList:
          type: array
          items:
            $ref: "#/components/schemas/H5SubtitleItem"
        totalTime:
          type: integer
        vid:
          type: string
        resourceType:
          type: integer
        viewable:
          type: boolean
        paidMode:
          type: integer
          nullable: true
    MovieDetailData:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enName:
          type: string
        introduction:
          type: string
        category:
          type: integer
        episodeCount:
          type: integer
        episodeRelease:
          type: integer
        coverHorizontalUrl:
          type: string
          format: uri
        coverVerticalUrl:
          type: string
          format: uri
        areaNameList:
          type: array
          items:
            type: string
        drameTypeVo:
          type: object
          properties:
            drameName:
              type: string
            drameType:
              type: string
        episodeVo:
          type: array
          items:
            $ref: "#/components/schemas/H5EpisodeItem"
        likeList:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"
    PlayInfoData:
      type: object
      properties:
        mediaUrl:
          type: string
          format: uri
        totalDuration:
          type: integer
        currentDefinition:
          type: string
        episodeId:
          type: string
        definitionList:
          type: array
          items:
            $ref: "#/components/schemas/H5DefinitionItem"
        subtitlingList:
          type: array
          items:
            $ref: "#/components/schemas/H5SubtitleItem"
    ContentListItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        contentType:
          type: string
        genres:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
        year:
          type: integer
        rating:
          type: number
          format: float
          nullable: true
        cover:
          type: string
        poster:
          type: string
        description:
          type: string
        episodeCount:
          type: integer
          nullable: true
        status:
          type: string
        statusCode:
          type: integer
          nullable: true

paths:
  /image:
    get:
      summary: Proxy gambar (cover/poster)
      operationId: proxyImage
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Gambar
          content:
            image/*:
              schema:
                type: string
                format: binary
        "400":
          description: Missing url parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "502":
          description: Gagal fetch gambar
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /subtitle:
    get:
      summary: Proxy subtitle (SRT)
      operationId: proxySubtitle
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: File SRT
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Missing url parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "502":
          description: Gagal fetch subtitle
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /stream:
    get:
      summary: Proxy stream (m3u8 / segment .ts)
      operationId: proxyStream
      description: |
        Proxy HLS stream. Untuk file m3u8, semua URL di dalamnya di-rewrite
        menjadi `/stream?url=...` agar segment .ts juga terproxy.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Stream content (m3u8 atau .ts)
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/MP2T:
              schema:
                type: string
                format: binary
        "400":
          description: Missing url parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "502":
          description: Gagal fetch stream
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /health:
    get:
      summary: Health check proxy
      operationId: healthCheck
      responses:
        "200":
          description: Proxy berjalan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: andflix-api

  /getHome:
    post:
      summary: Home — navigasi + konten
      operationId: getHome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - page
                - navId
              properties:
                page:
                  type: integer
                  example: 0
                navId:
                  type: integer
                  example: 1
      responses:
        "200":
          description: |
            Response home — berisi navigasi dan konten rekomendasi dalam satu panggilan.
          headers:
            X-Device-Id:
              schema:
                type: string
            X-Aeskey-Internal:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  navList:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  sectionList:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        Name:
                          type: string
                        ContentList:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              title:
                                type: string
                              contentType:
                                type: string
                              genres:
                                type: array
                                items:
                                  type: string
                              year:
                                type: integer
                                nullable: true
                              rating:
                                type: number
                                format: float
                                nullable: true
                              cover:
                                type: string
                                example: "/image?url=https://..."
                              poster:
                                type: string
                                example: "/image?url=https://..."
                              description:
                                type: string
                              episodeCount:
                                type: integer
                                nullable: true
                              status:
                                type: string
                                example: "Selesai"
                              statusCode:
                                type: integer
                                nullable: true

  /search:
    post:
      summary: Pencarian konten
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - size
                - keyword
              properties:
                size:
                  type: integer
                  example: 10
                keyword:
                  type: string
                  example: one piece
      responses:
        "200":
          description: Hasil pencarian
          headers:
            X-Device-Id:
              schema:
                type: string
            X-Aeskey-Internal:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        contentType:
                          type: string
                        genres:
                          type: array
                          items:
                            type: string
                        countries:
                          type: array
                          items:
                            type: string
                        year:
                          type: integer
                        rating:
                          type: number
                          format: float
                          nullable: true
                        cover:
                          type: string
                        poster:
                          type: string
                        description:
                          type: string
                        episodeCount:
                          type: integer
                          nullable: true
                        status:
                          type: string
                        statusCode:
                          type: integer
                          nullable: true

  /getDetail:
    post:
      summary: Detail konten + play info
      operationId: getDetail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - category
                - episode
              properties:
                id:
                  type: integer
                  example: 103934
                category:
                  type: integer
                  enum: [0, 1]
                  example: 1
                episode:
                  type: integer
                  example: 1
                  description: "Nomor episode. 0 = tanpa playInfo"
      responses:
        "200":
          description: Detail konten + rekomendasi + play info (jika episode > 0)
          headers:
            X-Device-Id:
              schema:
                type: string
            X-Aeskey-Internal:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  type:
                    type: string
                  contentType:
                    type: string
                  category:
                    type: integer
                  genres:
                    type: array
                    items:
                      type: string
                  countries:
                    type: array
                    items:
                      type: string
                    nullable: true
                  year:
                    type: integer
                    nullable: true
                  rating:
                    type: number
                    format: float
                    nullable: true
                  cover:
                    type: string
                  poster:
                    type: string
                  description:
                    type: string
                  episodeCount:
                    type: integer
                    nullable: true
                  status:
                    type: string
                  statusCode:
                    type: integer
                    nullable: true
                  playerInfo:
                    type: object
                    $ref: "#/components/schemas/PlayerInfo"
                  recommendations:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContentListItem"
                  totalDuration:
                    type: integer
                    nullable: true
